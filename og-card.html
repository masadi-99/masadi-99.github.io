<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #faf8f3;
      color: #1e1c18;
      display: flex;
      align-items: center;
      gap: 60px;
      padding: 78px 80px;
      font-family: Georgia, "Times New Roman", serif;
      position: relative;
    }
    .photo {
      width: 300px; height: 374px; flex: 0 0 auto;
      object-fit: cover; border-radius: 6px; border: 1px solid #e1dccf;
    }
    .text { flex: 1; min-width: 0; }
    .name { font-size: 82px; font-weight: 600; letter-spacing: -1.5px; line-height: 1; }
    .rule { width: 66px; height: 4px; background: #9c3b2e; margin: 26px 0 24px; }
    .role { font-size: 30px; color: #46423a; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; line-height: 1.35; }
    .tag { font-size: 25px; color: #6a655c; margin-top: 12px; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .url { font-size: 21px; color: #9c3b2e; margin-top: 34px; font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <img class="photo" src="assets/img/prof_pic.jpg" />
  <div class="text">
    <div class="name">Mohammad Asadi</div>
    <div class="rule"></div>
    <div class="role">PhD Candidate · Electrical Engineering · Stanford</div>
    <div class="tag">Multimodal AI for medicine — MIRAGE · MARCUS</div>
    <div class="url">masadi-99.github.io</div>
  </div>
</body>
</html>
